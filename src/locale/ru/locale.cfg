[mod-setting-description]
qol-modpack-compatibility-enabled=Когда включено, QoL Research будет опеределять если некоторые модпаки установлены и использовать кастомную конфигурацию для них. Список совместимых модпаков можно найти в config.lua или в ченжлоге.
qol-infinite-research-enabled=Когда включено, после основных исследований будут бесконечные исследования.

qol-crafting-speed-research-enabled=Включите чтобы добавить исследования для увеличения скорости создания предметов игроком.
qol-crafting-speed-flat-bonus=Начальный бонус скорости создания, не требует исследований, доступен с самого начала.
qol-crafting-speed-multiplier=Бонусы от исследований умножаются на это.

qol-inventory-size-research-enabled=Включите чтобы добавить исследования для увеличения размера инвентаря игрока.
qol-inventory-size-flat-bonus=Начальный бонус размера инвентаря, не требует исследований, доступен с самого начала.
qol-inventory-size-multiplier=Бонусы от исследований умножаются на это.

qol-mining-speed-research-enabled=Включите чтобы добавить исследования для увеличения скорости добычи игроком.
qol-mining-speed-flat-bonus=Начальный бонус скорости добычи, не требует исследований, доступен с самого начала.
qol-mining-speed-multiplier=Бонусы от исследований умножаются на это.

qol-movement-speed-research-enabled=Включите чтобы добавить исследования для увеличения скорости передвижения игрока.
qol-movement-speed-flat-bonus=Начальный бонус скорости передвижения, не требует исследований, доступен с самого начала.
qol-movement-speed-multiplier=Бонусы от исследований умножаются на это.

qol-player-reach-research-enabled=Включите чтобы добавить исследования для увеличения дальности взаимодействия игрока.
qol-player-reach-flat-bonus=Начальный бонус дальности взаимодействия, не требует исследований, доступен с самого начала.
qol-player-reach-multiplier=Бонусы от исследований умножаются на это.
qol-player-reach-field-item-drop-distance=Включите чтобы исследования также влияли на расстояние на которое можно выкинуть предмет (по умолчанию клавиша Z).
qol-player-reach-field-resource-reach-distance=Включите чтобы исследования также влияли на расстояние на котором можно добывать ресурсы (деревья, руда, и.т.д).

qol-custom-config=Введите кастомную конфигурацию, она может быть создана на https://qol-research.aidiakapi.com/.

